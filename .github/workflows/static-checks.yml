name: Static checks

on:
  push:
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source
        run: python -m py_compile SlicePlaneOpacity/SlicePlaneOpacity.py
      - name: Validate ExtensionsIndex JSON
        run: python -m json.tool ExtensionsIndex/SlicePlaneOpacity.json > /dev/null
